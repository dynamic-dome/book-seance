[project]
name = "book-seance"
version = "0.1.0"
description = "Talk to the people inside a book. Every answer is grounded in passages you can check."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.7.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.40",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
